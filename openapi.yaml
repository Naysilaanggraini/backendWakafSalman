    patch:
      tags:
      - Auth
      summary: Ubah profil atau upload foto
      operationId: patch_api_auth_me
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                required:
                - message
                - user
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '503':
          $ref: '#/components/responses/Error503'
      description: Hanya profil sendiri. JSON atau multipart/form-data; kirim satu file dengan nama foto. Request
