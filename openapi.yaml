# Kontrak API Lentera; sesuaikan saat route, validator, atau serializer berubah.
openapi: 3.1.0
info:
  title: Lentera — LMS Wakaf Salman API
  version: 1.0.0
  description: |-
    Kontrak berdasarkan implementasi Flask di repository. Gunakan Bearer JWT dari POST /api/auth/login; tidak ada refresh token/logout endpoint. Role dan status akun dibaca ulang dari database pada setiap request.

    Path learning memakai /api/course (singular); assessment memakai /api/courses (plural). ID berasal dari database, bukan ID contoh/frontend. Daftar katalog/user/enrollment tidak memiliki pagination; hanya activity mendukung pagination.

    Payload JSON memakai Content-Type: application/json. Field request yang tidak dikenal ditolak kecuali login/register yang mengabaikan field tambahan. Input teks umumnya di-trim. Global request limit 3 MiB; endpoint profil memakai batas 2 MiB + 64 KiB. Error aplikasi umumnya {message}; error framework/proxy (termasuk 413 di luar auth) dapat berupa HTML. Timestamp identitas/learning dapat tanpa timezone, sedangkan timestamp assessment/discussion memakai UTC dengan Z.

    Endpoint Development bersifat opsional dan selalu tidak tersedia pada production. Spesifikasi ini tidak menambahkan route HTTP baru atau Swagger UI.
servers:
- url: http://localhost:5000
  description: Flask development lokal
- url: http://localhost:8000
  description: Docker API lokal; sesuaikan API_PORT
- url: https://{hostname}
  description: Production HTTPS; ganti dengan hostname deployment
  variables:
    hostname:
      default: api.example.com
tags:
- name: System
- name: Auth
- name: Users
- name: Kategori
- name: Course
- name: Materi
- name: Enrollment
- name: Progress
- name: Assessment
- name: Discussion
- name: Reporting
- name: Development
security:
- bearerAuth: []
paths:
  /:
    get:
      tags:
      - System
      summary: Status backend
      operationId: getBackendStatus
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Backend LMS Wakaf Salman berjalan
      security: []
  /health/live:
