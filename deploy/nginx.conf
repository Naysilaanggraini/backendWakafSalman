# Install in the host nginx http context (sites-enabled or conf.d).
# Replace api.example.com and certificate paths before nginx -t.
limit_req_zone $binary_remote_addr zone=lentera_auth:10m rate=5r/m;

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.example.com;
    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 3m;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Proxy must overwrite client-supplied forwarding headers.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 65s;
    proxy_connect_timeout 5s;
    limit_req_status 429;

    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=lentera_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
