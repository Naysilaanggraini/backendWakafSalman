components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT HS256 dari login; Authorization: Bearer <token>. Berlaku 8 jam.'
  responses:
    Error400:
      description: Payload atau parameter tidak valid.
      content:
        application/json:
          schema:
