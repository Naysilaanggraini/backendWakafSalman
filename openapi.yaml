              schema:
                type: string
                format: binary
        '404':
          description: Nama file tidak valid atau file tidak ditemukan.
          content:
            text/html:
              schema:
                type: string
      security: []
      parameters:
      - name: filename
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{32}\.png$
