        '403':
          $ref: '#/components/responses/Error403'
        '413':
          $ref: '#/components/responses/Error413'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      description: Token berlaku 8 jam. Login mencatat activity; kegagalan commit tidak menghasilkan token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
