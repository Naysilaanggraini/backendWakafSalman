      security: []
  /health/ready:
    get:
      tags:
      - System
      summary: Kesiapan database dan migrasi
      operationId: get_health_ready
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Database tidak tersedia atau revisi belum terbaru.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: not_ready
      security: []
      description: 200 jika database terhubung dan revisi Alembic sama dengan head. Tidak mengembalikan detail koneksi.
  /api/auth/register:
    post:
      tags:
      - Auth
      summary: Registrasi akun user
      operationId: post_api_auth_register
      responses:
        '201':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Registrasi berhasil
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
